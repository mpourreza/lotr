- id: men
  kicker: The Age that is coming
  title: Kingdoms of Men
  lede: A ranger who is a king. A shield-maiden. A city of stone that will not yield.
  text: Gondor holds the line while its throne sits empty. Rohan keeps an oath written in horses and horns. Dale and Bree prove that not every Man is a Númenórean, and not every Man is a captain. When the Elves depart, the problems of Middle-earth become, more and more, the problems of Men.
