- id: unmaking
  kicker: An anti-quest
  title: The Ring unmade
  lede: Not to win an object, but to lose one on purpose.
  text: At Orodruin the Precious is destroyed and the Dark Tower falls. The king returns. The four travelers scour their own country. Then a white ship leaves Mithlond, because some wounds do not fully heal in Middle-earth. The chronicle is a map of that cost.
