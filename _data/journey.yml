- id: orcs
  kicker: The factories of war
  title: The Shadow
  lede: Mordor’s hosts. Isengard’s pits. A soldiery bred to hate even itself.
  text: "Orcs are not a unique horror like the Ring. They are a system: breeding pits, stolen crafts, captains who rule by fear. They quarrel, and twice that quarrel lets Hobbits slip through. Behind them stand a Maia who forged a master-ring and the Nine who took lesser rings and faded."
