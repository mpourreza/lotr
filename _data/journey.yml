- id: elves
  kicker: Memory still walking
  title: The Elven realms
  lede: Rivendell’s counsel. Lórien’s gold. A fading that is also a choice.
  text: The Firstborn keep what Men forget. Elrond’s house is a refuge and a parliament. Galadriel’s wood is a test as much as a gift. Their Rings preserve rather than conquer, and their deepest act in this Age is leave-taking—ships at Mithlond, and a world handed to mortals.
