- id: dwarves
  kicker: Stone remembers
  title: Halls under the mountain
  lede: Erebor reclaimed. Moria lost. A dwarf who will not leave an Elf to walk alone.
  text: Durin’s Folk measure time in crafts and grudges. They woke a terror in Khazad-dûm and later sent one of their own into the Fellowship anyway. Their Seven Rings kindled greed more than wraith-life. What they love, they make to outlast a lifespan.
