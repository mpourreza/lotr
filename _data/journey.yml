- id: shire
  kicker: Begin in the Westfarthing
  title: The Shire
  lede: Green hills, party trees, and a fire that should have been enough.
  text: The War of the Ring does not open on a battlefield. It opens in a hole in the ground, with a birthday, an inheritance, and a secret that has already begun to stretch a hobbit thin. Courage here looks like stubbornness. The great mistake of the Dark Lord is that he never thought to look this small.
